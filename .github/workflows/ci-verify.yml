name: Verify JS, Handlebars, CSS & Manifest

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  verify:
    name: Static Module Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Run JS, Handlebars, CSS, manifest & localization verifications
        run: node scripts/verify.mjs
